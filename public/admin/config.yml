# Decap CMS – Einstellungen der Verwaltungsoberfläche unter /admin
# Die Verbindung zu GitHub (backend) steht in public/admin/index.html.
# Dateipfade beziehen sich auf das Repository, daher "public/…".

locale: de
media_folder: public/assets/uploads
public_folder: /assets/uploads
site_url: /
display_url: /
logo_url: /assets/img/logo-full.png
collections:
- name: alben
  label: Foto-Alben
  editor:
    preview: false
  files:
  - name: albums
    label: Alben
    file: public/content/albums.json
    fields:
    - name: albums
      label: Alben
      label_singular: Album
      widget: list
      summary: '{{fields.title_de}} · {{fields.category}}'
      hint: Reihenfolge per Ziehen ändern – das erste Album steht oben links.
      fields:
      - name: title_de
        label: Titel (Deutsch)
        widget: string
      - name: title_en
        label: Titel (Englisch)
        widget: string
      - name: slug
        label: Kurzname für die Adresse
        widget: string
        pattern:
        - ^[a-z0-9-]+$
        - Nur Kleinbuchstaben, Ziffern und Bindestriche
        hint: z. B. waldbuehne-berlin-2026 – ergibt …/album/?a=waldbuehne-berlin-2026. Später nicht mehr ändern, sonst funktionieren geteilte Links nicht mehr.
      - name: category
        label: Kategorie
        widget: select
        options:
        - label: Portrait
          value: portrait
        - label: Street
          value: street
        - label: Landschaft
          value: landscape
        - label: Produkt
          value: product
        - label: Event & Konzert
          value: event
      - name: date
        label: Datum
        widget: datetime
        required: false
        date_format: DD.MM.YYYY
        time_format: false
        format: YYYY-MM-DD
        picker_utc: true
      - name: place
        label: Ort
        widget: string
        required: false
      - name: cover
        label: Titelbild
        widget: image
        required: false
        hint: Leer lassen = erstes Foto des Albums. JPG, lange Kante ca. 2000 px, möglichst unter 500 KB. Handyfotos vorher verkleinern (z. B. mit squoosh.app).
      - name: text_de
        label: Beschreibung (Deutsch)
        widget: text
        required: false
      - name: text_en
        label: Beschreibung (Englisch)
        widget: text
        required: false
      - name: camera
        label: Kamera (für alle Fotos)
        widget: string
        required: false
        default: LUMIX G70
        hint: z. B. LUMIX G70 oder Samsung Galaxy A52s. Kann pro Foto überschrieben werden.
      - name: photos
        label: Fotos
        label_singular: Foto
        widget: list
        summary: '{{fields.caption}} {{fields.image}}'
        fields:
        - name: image
          label: Bild
          widget: image
          hint: JPG, lange Kante ca. 2000 px, möglichst unter 500 KB. Handyfotos vorher verkleinern (z. B. mit squoosh.app).
        - name: caption
          label: Bildunterschrift
          widget: string
          required: false
        - name: alt
          label: Bildbeschreibung (für Screenreader)
          widget: string
          required: false
        - name: camera
          label: Kamera (nur falls abweichend)
          widget: string
          required: false
        - name: focal
          label: Brennweite
          widget: string
          required: false
          hint: z. B. 25 mm
        - name: aperture
          label: Blende
          widget: string
          required: false
          hint: z. B. f/5.6
        - name: shutter
          label: Verschlusszeit
          widget: string
          required: false
          hint: z. B. 1/250 s
        - name: iso
          label: ISO
          widget: string
          required: false
          hint: z. B. ISO 200
- name: playlists
  label: Motion-Playlists
  editor:
    preview: false
  files:
  - name: playlists
    label: Playlists
    file: public/content/playlists.json
    fields:
    - name: playlists
      label: Playlists
      label_singular: Playlist
      widget: list
      summary: '{{fields.title_de}}'
      fields:
      - name: title_de
        label: Titel (Deutsch)
        widget: string
      - name: title_en
        label: Titel (Englisch)
        widget: string
      - name: tag
        label: Kategorie-Zeile
        widget: string
        required: false
        hint: z. B. UI · Animation
      - name: text_de
        label: Kurzbeschreibung (Deutsch)
        widget: text
        required: false
      - name: text_en
        label: Kurzbeschreibung (Englisch)
        widget: text
        required: false
      - name: playlist_url
        label: YouTube-Playlist-Link
        widget: string
        required: false
        hint: Auf YouTube die Playlist öffnen → Teilen → Link kopieren (enthält „list=…“).
      - name: cover
        label: Vorschaubild
        widget: image
        required: false
        hint: Eigenes Bild hochladen. YouTube-Vorschaubilder werden aus Datenschutzgründen nicht automatisch geladen.
- name: labor
  label: Labor
  editor:
    preview: false
  files:
  - name: lab
    label: Vorhaltekarten
    file: public/content/lab.json
    fields:
    - name: series
      label: Serien-Bezeichnung
      widget: string
      hint: z. B. A
    - name: cards
      label: Karten
      label_singular: Karte
      widget: list
      summary: '{{fields.value}} · {{fields.aperture}} · {{fields.iso}}'
      fields:
      - name: value
        label: Großer Wert
        widget: string
        hint: z. B. 1/250
      - name: aperture
        label: Blende
        widget: string
        required: false
      - name: iso
        label: ISO
        widget: string
        required: false
      - name: highlight
        label: Hervorheben (Pfirsich)
        widget: boolean
        default: false
        required: false
- name: rechtliches
  label: Rechtliches
  editor:
    preview: false
  files:
  - name: legal
    label: Impressum & Datenschutz
    file: public/content/legal.json
    description: Pflichtangaben und Rechtstexte. Die deutsche Fassung ist maßgeblich – bei Änderungen die englische Übersetzung bitte mit anpassen.
    fields:
    - name: operator
      label: Deine Angaben (Impressum & Verantwortlicher)
      widget: object
      collapsed: false
      fields:
      - name: name
        label: Vor- und Nachname
        widget: string
      - name: business
        label: Firmen-/Markenname
        widget: string
        required: false
      - name: street
        label: Straße und Hausnummer
        widget: string
        hint: Ladungsfähige Anschrift – kein Postfach.
      - name: city
        label: PLZ und Ort
        widget: string
      - name: phone
        label: Telefon
        widget: string
        required: false
      - name: email
        label: E-Mail
        widget: string
      - name: vat_id
        label: USt-IdNr. (falls vorhanden)
        widget: string
        required: false
    - name: impressum_de
      label: Impressum – weitere Abschnitte (Deutsch)
      widget: object
      collapsed: true
      fields:
      - name: sections
        label: Abschnitte
        label_singular: Abschnitt
        widget: list
        summary: '{{fields.title}}'
        fields:
        - name: title
          label: Überschrift
          widget: string
        - name: text
          label: Text
          widget: text
          hint: Leerzeile = neuer Absatz. Einfache Zeilenumbrüche bleiben erhalten.
        - name: style
          label: Darstellung
          widget: select
          required: false
          default: ''
          options:
          - label: Normal
            value: ''
          - label: Hinterlegt
            value: box
          - label: Umrandet
            value: outline
        - name: anchor
          label: Sprungmarke
          widget: hidden
          required: false
    - name: imprint_en
      label: Legal Notice – weitere Abschnitte (Englisch)
      widget: object
      collapsed: true
      fields:
      - name: sections
        label: Abschnitte
        label_singular: Abschnitt
        widget: list
        summary: '{{fields.title}}'
        fields:
        - name: title
          label: Überschrift
          widget: string
        - name: text
          label: Text
          widget: text
          hint: Leerzeile = neuer Absatz. Einfache Zeilenumbrüche bleiben erhalten.
        - name: style
          label: Darstellung
          widget: select
          required: false
          default: ''
          options:
          - label: Normal
            value: ''
          - label: Hinterlegt
            value: box
          - label: Umrandet
            value: outline
        - name: anchor
          label: Sprungmarke
          widget: hidden
          required: false
    - name: datenschutz_de
      label: Datenschutzerklärung (Deutsch)
      widget: object
      collapsed: true
      fields:
      - name: updated
        label: Stand
        widget: string
        hint: z. B. Oktober 2026
      - name: intro
        label: Einleitung
        widget: text
        required: false
      - name: sections
        label: Abschnitte (Nr. 1 „Verantwortlicher“ wird automatisch aus deinen Angaben erzeugt)
        label_singular: Abschnitt
        widget: list
        summary: '{{fields.title}}'
        fields:
        - name: title
          label: Überschrift
          widget: string
        - name: text
          label: Text
          widget: text
          hint: Leerzeile = neuer Absatz. Einfache Zeilenumbrüche bleiben erhalten.
        - name: style
          label: Darstellung
          widget: select
          required: false
          default: ''
          options:
          - label: Normal
            value: ''
          - label: Hinterlegt
            value: box
          - label: Umrandet
            value: outline
        - name: anchor
          label: Sprungmarke
          widget: hidden
          required: false
    - name: privacy_en
      label: Privacy Policy (Englisch)
      widget: object
      collapsed: true
      fields:
      - name: updated
        label: Stand (englisch, z. B. October 2026)
        widget: string
      - name: intro
        label: Einleitung
        widget: text
        required: false
      - name: sections
        label: Abschnitte (Nr. 1 „Controller“ wird automatisch erzeugt)
        label_singular: Abschnitt
        widget: list
        summary: '{{fields.title}}'
        fields:
        - name: title
          label: Überschrift
          widget: string
        - name: text
          label: Text
          widget: text
          hint: Leerzeile = neuer Absatz. Einfache Zeilenumbrüche bleiben erhalten.
        - name: style
          label: Darstellung
          widget: select
          required: false
          default: ''
          options:
          - label: Normal
            value: ''
          - label: Hinterlegt
            value: box
          - label: Umrandet
            value: outline
        - name: anchor
          label: Sprungmarke
          widget: hidden
          required: false
- name: einstellungen
  label: Einstellungen
  editor:
    preview: false
  files:
  - name: settings
    label: Allgemein & Kontakt
    file: public/content/settings.json
    fields:
    - name: name
      label: Dein Name
      widget: string
    - name: email
      label: E-Mail-Adresse
      widget: string
      required: false
    - name: city_en
      label: Ort (Englisch)
      widget: string
      required: false
    - name: city_de
      label: Ort (Deutsch)
      widget: string
      required: false
    - name: established
      label: Seit (Jahr)
      widget: string
      required: false
    - name: available_en
      label: Verfügbar ab (Englisch)
      widget: string
      required: false
      hint: z. B. From November
    - name: available_de
      label: Verfügbar ab (Deutsch)
      widget: string
      required: false
      hint: z. B. Ab November
    - name: portrait
      label: Portraitfoto
      widget: image
      required: false
    - name: about_en
      label: Über mich (Englisch)
      widget: text
      required: false
    - name: about_de
      label: Über mich (Deutsch)
      widget: text
      required: false
    - name: showreel_youtube_id
      label: Showreel (YouTube-Link oder Video-ID)
      widget: string
      required: false
    - name: showreel_label
      label: Showreel-Bezeichnung
      widget: hidden
      required: false
    - name: youtube_url
      label: YouTube-Kanal (Link)
      widget: string
      required: false
      hint: https://www.youtube.com/@…
    - name: instagram_url
      label: Instagram (Link)
      widget: string
      required: false
      hint: https://www.instagram.com/…
    - name: pinterest_url
      label: Pinterest (Link)
      widget: string
      required: false
      hint: https://www.pinterest.com/…
